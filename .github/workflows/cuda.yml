name: CUDA correctness

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: OS label of a trusted self-hosted CUDA runner
        type: choice
        options: [linux, windows]
        default: linux
        required: true
      torch:
        description: PyTorch version; its CUDA variant must match the runner's toolkit
        type: string
        default: '2.10.0'
        required: true
      index:
        description: PyTorch wheel index for that CUDA variant, such as cu130
        type: string
        default: cu130
        required: true
      python:
        description: Python version
        type: string
        default: '3.12'
        required: true

permissions:
  contents: read

jobs:
  cuda:
    runs-on: [self-hosted, '${{ inputs.runner_os }}', gpu]
    timeout-minutes: 60
    env:
      MAX_JOBS: '2'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python }}
      - name: Install PyTorch on Linux
        if: runner.os != 'Windows'
        env:
          TORCH_VERSION: ${{ inputs.torch }}
          PIP_INDEX_URL: https://download.pytorch.org/whl/${{ inputs.index }}
        run: python -m pip install "torch==${TORCH_VERSION}"
      - name: Install PyTorch on Windows
        if: runner.os == 'Windows'
        env:
          TORCH_VERSION: ${{ inputs.torch }}
          PIP_INDEX_URL: https://download.pytorch.org/whl/${{ inputs.index }}
        run: python -m pip install "torch==$env:TORCH_VERSION"
      - run: python -m pip install -e ".[dev,onnx]"
      - run: nvidia-smi
      - run: python -m pytest -q --junitxml=.artifacts/cuda.xml
      - run: python benchmarks/summarize_tests.py --junit .artifacts/cuda.xml --output .artifacts/cuda.json
      - run: python -m build
      - run: python tools/check_dist.py --install
      - run: python -I tools/smoke_test.py --installed --device cuda:0 --backend native --onnx
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cuda-correctness
          path: |
            .artifacts/*.xml
            .artifacts/*.json
            dist/*
