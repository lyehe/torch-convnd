name: CUDA correctness

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: OS label of a trusted self-hosted CUDA runner
        type: choice
        options: [linux, windows]
        default: linux
        required: true

permissions:
  contents: read

jobs:
  cuda:
    runs-on: [self-hosted, '${{ inputs.runner_os }}', gpu]
    timeout-minutes: 60
    env:
      MAX_JOBS: '2'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cu130
      - run: python -m pip install -e ".[dev,onnx]"
      - run: nvidia-smi
      - run: python -m pytest -q --junitxml=.artifacts/cuda.xml
      - run: python benchmarks/summarize_tests.py --junit .artifacts/cuda.xml --output .artifacts/cuda.json
      - run: python -m build
      - run: python tools/check_dist.py --install
      - run: python -I tools/smoke_test.py --installed --device cuda:0 --backend native --onnx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuda-correctness
          path: |
            .artifacts/*.xml
            .artifacts/*.json
            dist/*
