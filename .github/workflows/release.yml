name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Build artifacts, or publish an existing version tag
        type: choice
        options: [artifacts, testpypi, pypi]
        default: artifacts
        required: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - name: Validate artifacts and version tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python tools/check_dist.py
      - run: python -m twine check dist/*
      - name: Check the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/release_notes.py "${{ github.ref_name }}"
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*

  github-release:
    # Attach the verified wheel and sdist to a GitHub release for the version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release_notes.py "$TAG" > release-notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md \
              --verify-tag --repo "$GITHUB_REPOSITORY"
          fi

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v') && ((github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') || (github.event_name == 'push' && vars.PUBLISH_PYPI == 'true'))
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
