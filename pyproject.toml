[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torch-convnd"
dynamic = ["version"]
description = "Native full N-dimensional dense convolution for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yehe Liu"}]
dependencies = ["torch>=1.11"]
keywords = ["pytorch", "convolution", "conv4d", "nd", "deep-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.optional-dependencies]
legacy = ["numpy>=1.23.2,<2"]
native = ["ninja>=1.11", "setuptools>=70", "packaging>=23"]
dev = [
  "pytest>=8", "pytest-cov>=6", "hypothesis>=6.100",
  "ruff==0.17.3", "pre-commit>=4.2,<5", "mypy>=1.15",
  "build>=1", "twine>=6", "numpy>=1.24", "pyyaml>=6",
  "ninja>=1.11", "setuptools>=70", "packaging>=23",
]
docs = ["mkdocs>=1.6,<2", "mkdocstrings[python]>=0.26", "pymdown-extensions>=10,<12"]
onnx = ["onnx>=1.17", "onnxscript>=0.2", "onnxruntime>=1.22"]

[project.urls]
Source = "https://github.com/lyehe/torch-convnd"
Documentation = "https://github.com/lyehe/torch-convnd/tree/main/docs"
Issues = "https://github.com/lyehe/torch-convnd/issues"

[project.scripts]
torch-convnd-benchmark = "torch_convnd.benchmark:main"
torch-convnd-info = "torch_convnd.diagnostics:main"

[tool.hatch.version]
path = "src/torch_convnd/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/torch_convnd"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/examples", "/tools", "/benchmarks", "/.github",
  "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md",
  "/pyproject.toml", "/mkdocs.yml", "/.pre-commit-config.yaml",
  "/.editorconfig", "/.gitattributes", "/.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"
markers = [
  "portable: correctness and integration checks that need no native compiler",
  "native: checks that require the compiled addon",
]

[tool.coverage.run]
source = ["torch_convnd"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
files = ["tests/typing/consumer.py"]
follow_imports = "silent"
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["torch_convnd"]
